name: db_flow
description: "DB Flow: editor di diagrammi di flusso strutturati ed eseguibili."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
    - assets/examples/en/
    - assets/examples/fr/
    - assets/examples/de/
    - assets/examples/es/
    - assets/exercises/
    - assets/exercises/en/
    - assets/exercises/fr/
    - assets/exercises/de/
    - assets/exercises/es/
    - assets/icon/icon.png
    - assets/icon/splash.png
  fonts:
    - family: DBFlowArrow
      fonts:
        - asset: assets/fonts/DBFlowArrow.ttf

# Icone e splash: immagini sorgente generate da tool/icons/render_icons_test.dart
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1F5FAD"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
  macos:
    generate: true
    image_path: assets/icon/icon_macos.png
  # Windows: stessa icona del Mac (quadrato arrotondato con margine trasparente)
  windows:
    generate: true
    image_path: assets/icon/icon_macos.png
    icon_size: 256

flutter_native_splash:
  color: "#1F5FAD"
  image: assets/icon/splash.png
  android_12:
    color: "#1F5FAD"
    image: assets/icon/splash_android12.png
  ios_content_mode: center
  fullscreen: false

# Pacchetto MSIX per il Microsoft Store (sul PC Windows):
#   flutter build windows --release && dart run msix:create --store
# Identità assegnata da Partner Center (prenotazione del nome): non è un segreto,
# compare in ogni pacchetto pubblicato. Il pacchetto per lo Store lo firma
# Microsoft. Nessuna «capability» oltre a runFullTrust, obbligatoria per le app
# desktop: niente accesso a internet dichiarato.
msix_config:
  display_name: DB Flow
  publisher_display_name: Davide Bertolino
  identity_name: DavideBertolino.DBFlow
  publisher: CN=D690F6A5-53AB-468E-9581-1266A41A362B
  # Va aumentata a ogni nuovo invio allo Store (l'ultima cifra deve restare 0).
  msix_version: 1.0.0.0
  logo_path: assets/icon/icon_macos.png
  # Doppio clic sui .flow: Windows avvia l'app con il percorso come argomento
  # (main(args)); con l'app già aperta il file passa alla finestra esistente.
  file_extension: .flow
  languages: it-it, en-us, fr-fr, de-de, es-es
